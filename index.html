<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 경제 나비효과 30초 컷</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10141c;--bg:#eef1f6;--card:#fff;--tx:#10141c;--sub:#5b6575;--blue:#3182f6;--red:#f04452;--gold:#ffb800;--line:#dde2ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f15;--card:#1a202b;--tx:#f2f4f8;--sub:#9aa4b5;--line:#2b3342}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;overflow-x:hidden}
.app{max-width:440px;margin:0 auto;height:100%;position:relative;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:18px}
.scr.on{display:flex}
h1,.hd{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;inset:0}
/* intro */
#intro{padding:0;color:#fff}
#intro .shade{background:linear-gradient(180deg,rgba(8,10,16,.55) 0%,rgba(8,10,16,.1) 35%,rgba(8,10,16,.92) 78%)}
#intro .in{position:relative;margin-top:auto;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
#intro h1{font-size:40px;line-height:1.12;margin:0 0 10px}
#intro p{margin:0 0 6px;font-size:15px;line-height:1.5;color:#e4e8ef}
.wallet{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;margin:12px 0 16px}
.cta{width:100%;border:0;border-radius:16px;background:var(--blue);color:#fff;font:700 17px 'Noto Sans KR';padding:17px;cursor:pointer}
.cta:active{transform:scale(.98)}
.cta.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);margin-top:10px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* game */
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:9px;transition:width .4s}
.cnt{font-size:13px;font-weight:700;color:var(--sub);min-width:34px}
.combo{font-size:12px;font-weight:700;background:var(--gold);color:#3a2a00;border-radius:99px;padding:4px 10px;opacity:0;transition:.2s}
.combo.on{opacity:1}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-y;min-height:0}
.news{width:100%;background:var(--ink);color:#fff;border-radius:26px;padding:26px 22px;box-shadow:0 18px 40px rgba(16,20,28,.28);cursor:grab;user-select:none;position:relative}
.news:active{cursor:grabbing}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;margin-bottom:14px}
.news .em{font-size:54px;line-height:1}
.news h2{font-family:'Black Han Sans';font-weight:400;font-size:25px;line-height:1.3;margin:12px 0 14px}
.news .q{font-size:15px;line-height:1.55;color:#c9d1de;border-top:1px solid #2c3544;padding-top:14px}
.stamp{position:absolute;top:18px;font:700 14px 'Noto Sans KR';padding:5px 10px;border-radius:8px;opacity:0;border:2px solid #fff}
.stamp.l{left:16px}.stamp.r{right:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:14px 12px;font:500 14px/1.45 'Noto Sans KR';text-align:left;cursor:pointer;min-height:112px}
.opt b{display:block;font-size:12px;color:var(--blue);margin-bottom:6px}
.opt:active{transform:scale(.97)}
.hint{text-align:center;font-size:12px;color:var(--sub);margin:10px 0 2px}
/* feedback */
#fb{padding:0;color:#fff}
#fb .shade{background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 40%)}
.badge{position:relative;margin:calc(20px + env(safe-area-inset-top,0px)) 18px 0;align-self:flex-start;font-family:'Black Han Sans';font-size:26px;padding:8px 16px;border-radius:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);animation:pop .35s}
.sheet{position:relative;margin-top:auto;background:var(--card);color:var(--tx);border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .35s}
.sheet h3{margin:0 0 12px;font-size:15px;color:var(--sub)}
.step{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.55}
.step u{text-decoration:none;flex:none;width:58px;font-weight:700;font-size:12px;color:var(--blue);padding-top:2px}
.sheet .cta{margin-top:12px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
/* result */
#res{align-items:center;text-align:center;justify-content:center;gap:6px}
#res .big{font-size:64px}
#res h2{font-family:'Black Han Sans';font-weight:400;font-size:30px;margin:4px 0}
.money{font-family:'Black Han Sans';font-size:46px;color:var(--blue)}
.note{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--sub);margin:8px 0 18px}
#res .cta{max-width:340px}
.coin{position:fixed;top:-40px;font-size:26px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

let Q,i,score,combo,bal=0,locked,pair,claimed;
const fmt=n=>n.toLocaleString("ko-KR");
function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id))}
function upBal(){document.querySelectorAll(".bal").forEach(e=>e.textContent=fmt(bal))}
function start(){Q=[...D].sort(()=>Math.random()-.5).slice(0,5);i=0;score=0;combo=0;claimed=false;load();show("game")}
function load(){
 const d=Q[i];locked=false;
 $("#cnt").textContent=(i+1)+"/5";$("#bar").style.width=(i/5*100)+"%";
 $("#combo").textContent="🔥 "+combo+"콤보";$("#combo").classList.toggle("on",combo>=2);
 $("#em").textContent=d[0];$("#hl").textContent=d[1];$("#qq").textContent=d[2];
 pair=Math.random()<.5?[{t:d[3],ok:1},{t:d[4],ok:0}]:[{t:d[4],ok:0},{t:d[3],ok:1}];
 $("#oa").innerHTML="<b>A</b>"+pair[0].t;$("#ob").innerHTML="<b>B</b>"+pair[1].t;
 const c=$("#card");c.style.transition="none";c.style.transform="";$("#sl").style.opacity=$("#sr").style.opacity=0;
}
function pick(k){
 if(locked)return;locked=true;
 const ok=pair[k].ok,d=Q[i];
 if(ok){score++;combo++}else combo=0;
 $("#fbimg").style.backgroundImage="url("+(ok?IMG_GOOD:IMG_BAD)+")";
 $("#badge").textContent=ok?"⭕ 정답! +100원 적립":"❌ 앗, 물렸다! 0원";
 const L=["① 원인","② 시장 반응","③ 내 계좌"];
 $("#steps").innerHTML=d[5].map((t,j)=>"<div class='step'><u>"+L[j]+"</u><span>"+t+"</span></div>").join("");
 $("#next").textContent=i==4?"결과 보러 가기":"다음 문제로 넘어가기";
 show("fb");
}
function res(){
 const m=score*100;
 $("#rb").textContent=score>=4?"🎉":score>=2?"🙂":"🥲";
 $("#rt").textContent="총 "+fmt(m)+"원 획득!";
 $("#rm").textContent="+"+fmt(m)+"원";
 $("#rs").textContent="5문제 중 "+score+"문제 정답 · 증권계좌 투자 지원금";
 $("#claim").style.display="";$("#claim").disabled=false;$("#again").style.display="none";
 show("res");if(m>0)rain();
}
function rain(){for(let k=0;k<36;k++){const e=document.createElement("div");e.className="coin";e.textContent=["🪙","🎉","💸","✨"][k%4];
 e.style.left=Math.random()*100+"vw";e.style.animationDuration=(2+Math.random()*2.5)+"s";e.style.animationDelay=Math.random()*1.2+"s";
 document.body.appendChild(e);setTimeout(()=>e.remove(),6000)}}
$("#start").onclick=start;
$("#oa").onclick=()=>pick(0);$("#ob").onclick=()=>pick(1);
$("#next").onclick=()=>{if(i==4)res();else{i++;load();show("game")}};
$("#claim").onclick=()=>{if(claimed)return;claimed=true;bal+=score*100;upBal();
 $("#claim").textContent="✅ 계좌로 입금 완료!";$("#claim").disabled=true;$("#again").style.display="";rain()};
$("#again").onclick=()=>{$("#claim").textContent="내 증권계좌로 캐시 받기";start()};
// swipe
(function(){const c=$("#card");let x0=null,dx=0;
 c.addEventListener("pointerdown",e=>{if(locked)return;x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition="none"});
 c.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;c.style.transform="translateX("+dx+"px) rotate("+dx/18+"deg)";
  $("#sl").style.opacity=dx<0?Math.min(1,-dx/90):0;$("#sr").style.opacity=dx>0?Math.min(1,dx/90):0});
 const end=()=>{if(x0===null)return;const d=dx;x0=null;dx=0;
  if(Math.abs(d)>90){c.style.transition=".25s";c.style.transform="translateX("+(d>0?500:-500)+"px) rotate("+(d>0?25:-25)+"deg)";setTimeout(()=>pick(d>0?1:0),180)}
  else{c.style.transition=".2s";c.style.transform="";$("#sl").style.opacity=$("#sr").style.opacity=0}};
 c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end)})();
</script></body></html>
